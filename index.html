<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: 'rgb(var(--brand) / <alpha-value>)',
        brand2: 'rgb(var(--brand-2) / <alpha-value>)',
        accent: 'rgb(var(--accent) / <alpha-value>)',
        ink: 'rgb(var(--ink) / <alpha-value>)',
        mute: 'rgb(var(--mute) / <alpha-value>)',
        soft: 'rgb(var(--soft) / <alpha-value>)',
        bg: 'rgb(var(--bg) / <alpha-value>)',
      },
      fontFamily: {
        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
        display: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'sans-serif'],
      },
      boxShadow: {
        card: '0 2px 16px rgba(15,23,42,.06)',
        lift: '0 12px 40px rgba(15,23,42,.14)',
        glow: '0 8px 32px rgba(0,106,105,.28)',
        glowA: '0 8px 32px rgba(241,109,13,.34)',
      },
    },
  },
};
</script>
<style>
  :root {
    --brand: 0 106 105;
    --brand-2: 14 165 164;
    --accent: 241 109 13;
    --ink: 11 28 48;
    --mute: 61 73 73;
    --soft: 238 243 255;
    --bg: 248 249 255;
  }
  html { scroll-behavior: smooth; scroll-padding-top: 112px; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .material-symbols-outlined { user-select: none; }
  ::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }

  body.editing [data-edit] { outline: 2px dashed rgba(var(--accent), 1); outline-offset: 4px; cursor: text; border-radius: 4px; }
  body.editing [data-edit]:hover { background: rgba(var(--accent), .07); }

  /* Reveal on scroll (fallback if GSAP missing / reduced motion handles in JS) */
  .rv { opacity: 0; transform: translateY(26px); transition: opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1); transition-delay: var(--d, 0s); }
  .rv-in { opacity: 1; transform: none; }

  /* Marquee */
  .marquee { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
  .marquee-track { display: flex; gap: 1.5rem; width: max-content; animation: scrollX var(--speed, 34s) linear infinite; }
  .marquee.reverse .marquee-track { animation-direction: reverse; }
  .marquee.paused:hover .marquee-track { animation-play-state: paused; }
  @keyframes scrollX { to { transform: translateX(-50%); } }

  /* Floating */
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  .floaty { animation: floaty 5s ease-in-out infinite; }
  .floaty-slow { animation: floaty 7s ease-in-out infinite; }

  /* Pulse ring for REC / badges */
  @keyframes pingSoft { 0% { transform: scale(1); opacity: .8; } 70%,100% { transform: scale(1.9); opacity: 0; } }
  .ping-dot { position: relative; }
  .ping-dot::after { content: ''; position: absolute; inset: 0; border-radius: 9999px; background: currentColor; animation: pingSoft 1.6s cubic-bezier(0,0,.2,1) infinite; }

  /* Button shine sweep */
  .shine { position: relative; overflow: hidden; }
  .shine::after { content: ''; position: absolute; top: 0; left: -75%; height: 100%; width: 50%; transform: skewX(-20deg); background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); }
  .shine:hover::after { animation: shineMove .9s ease forwards; }
  @keyframes shineMove { to { left: 130%; } }

  /* Audio bars */
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 18px; }
  .bars span { width: 4px; border-radius: 3px; background: currentColor; animation: barEq 1.1s ease-in-out infinite; }
  .bars span:nth-child(1) { animation-delay: 0s; } .bars span:nth-child(2) { animation-delay: .18s; }
  .bars span:nth-child(3) { animation-delay: .36s; } .bars span:nth-child(4) { animation-delay: .09s; }
  .bars span:nth-child(5) { animation-delay: .27s; }
  @keyframes barEq { 0%,100% { height: 20%; } 50% { height: 100%; } }

  /* FAQ accordion */
  .faq-item details > summary { list-style: none; }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item .faq-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.22,1,.36,1); }
  .faq-item details[open] .faq-body { grid-template-rows: 1fr; }
  .faq-item .faq-body > div { overflow: hidden; }
  .faq-item .chev { transition: transform .35s ease; }
  .faq-item details[open] .chev { transform: rotate(180deg); }

  /* 3D tilt */
  .tilt { transform-style: preserve-3d; transition: transform .18s ease-out; will-change: transform; }
  .tilt-inner { transform: translateZ(28px); }

  /* Progress bar */
  #scroll-progress { transform-origin: 0 50%; transform: scaleX(0); }

  /* Confetti */
  #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 90; }

  /* Google badge */
  .g-badge { background: linear-gradient(135deg,#4285F4,#0F9D58); }

  /* gradient text */
  .grad-text { background: linear-gradient(90deg, rgb(var(--brand)), rgb(var(--brand-2))); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* hero blob */
  .blob { filter: blur(70px); opacity:.55; }

  @media (prefers-reduced-motion: reduce) {
    .marquee-track, .floaty, .floaty-slow, .ping-dot::after, .shine::after, .bars span { animation: none !important; }
    .rv { opacity: 1 !important; transform: none !important; }
    html { scroll-behavior: auto; }
  }

  body.editing #app { pointer-events: none; }
  body.editing #app [contenteditable], body.editing #app [data-img] { pointer-events: auto; }
</style>
